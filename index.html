<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JARVIS v15</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#07090d;
    --panel:#0d1118;
    --panel2:#111722;
    --border:#202936;
    --text:#f4f7fb;
    --muted:#8b95a5;
    --accent:#6ea8ff;
    --green:#36d399;
    --red:#ff6577;
}

body{
    font-family:Inter,Segoe UI,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    height:100vh;
    overflow:hidden;
}

.app{
    display:flex;
    width:100%;
    height:100vh;
}

/* SIDEBAR */
.sidebar{
    width:250px;
    background:#090c11;
    border-right:1px solid var(--border);
    padding:18px;
    display:flex;
    flex-direction:column;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
    margin-bottom:25px;
}

.logo{
    width:38px;
    height:38px;
    border:1px solid #344050;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    background:#101620;
}

.brand-text{
    font-weight:700;
    font-size:17px;
}

.version{
    font-size:11px;
    color:var(--muted);
    margin-top:2px;
}

.new-chat{
    width:100%;
    border:1px solid var(--border);
    background:#121821;
    color:white;
    border-radius:11px;
    padding:11px;
    cursor:pointer;
    font-size:14px;
    margin-bottom:20px;
}

.new-chat:hover{
    background:#18212d;
}

.section-title{
    color:#6f7988;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    margin:8px 3px;
}

.conversation{
    color:#aab3c1;
    font-size:13px;
    padding:10px;
    border-radius:9px;
    margin-bottom:4px;
}

.conversation.active{
    background:#111923;
    color:white;
}

.sidebar-bottom{
    margin-top:auto;
}

.connection{
    display:flex;
    align-items:center;
    gap:8px;
    color:#8f99a8;
    font-size:12px;
}

.dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#777;
}

.dot.online{
    background:var(--green);
    box-shadow:0 0 8px rgba(54,211,153,.5);
}

/* MAIN */
.main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
}

.topbar{
    height:64px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    background:rgba(9,12,17,.92);
}

.top-title{
    font-size:15px;
    font-weight:600;
}

.stats{
    display:flex;
    gap:18px;
    color:#8c96a5;
    font-size:12px;
}

.stat strong{
    color:#dce3ed;
    font-weight:500;
}

/* CHAT */
.chat{
    flex:1;
    overflow-y:auto;
    padding:30px 20px 150px;
}

.chat-inner{
    max-width:850px;
    margin:auto;
}

.welcome{
    min-height:55vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.welcome-box{
    max-width:550px;
}

.welcome-icon{
    width:70px;
    height:70px;
    margin:0 auto 20px;
    border:1px solid #303b4b;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:29px;
    background:#101620;
}

.welcome h1{
    font-size:31px;
    margin-bottom:10px;
}

.welcome p{
    color:var(--muted);
    line-height:1.6;
    font-size:14px;
}

.message{
    display:flex;
    gap:13px;
    margin:20px 0;
}

.avatar{
    width:34px;
    height:34px;
    min-width:34px;
    border-radius:10px;
    background:#121923;
    border:1px solid #263140;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
}

.message.user .avatar{
    background:#172131;
}

.message-content{
    min-width:0;
    flex:1;
}

.message-name{
    font-size:12px;
    color:#8993a2;
    margin-bottom:6px;
}

.message-text{
    font-size:14px;
    line-height:1.65;
    white-space:pre-wrap;
    word-break:break-word;
}

.message-actions{
    display:flex;
    gap:6px;
    margin-top:8px;
}

.small-btn{
    background:transparent;
    color:#7d8796;
    border:1px solid transparent;
    padding:4px 7px;
    border-radius:6px;
    cursor:pointer;
    font-size:11px;
}

.small-btn:hover{
    color:white;
    border-color:var(--border);
    background:#10151d;
}

/* PERMISSION */
.permission{
    margin:15px 0 15px 47px;
    padding:15px;
    border:1px solid #303a49;
    background:#10151d;
    border-radius:13px;
}

.permission-title{
    font-size:13px;
    font-weight:600;
    margin-bottom:5px;
}

.permission-description{
    color:#8f99a7;
    font-size:12px;
    line-height:1.5;
    margin-bottom:12px;
}

.permission-buttons{
    display:flex;
    gap:8px;
}

.allow,
.deny{
    border:0;
    border-radius:8px;
    padding:8px 15px;
    cursor:pointer;
    font-size:12px;
}

.allow{
    background:#dcefe7;
    color:#0b1813;
}

.deny{
    background:#202732;
    color:#d7dde6;
}

.allow:hover{
    opacity:.88;
}

.deny:hover{
    background:#29313d;
}

/* COMPOSER */
.composer-area{
    position:fixed;
    left:250px;
    right:0;
    bottom:0;
    padding:18px 20px 20px;
    background:linear-gradient(
        transparent,
        rgba(7,9,13,.96) 35%
    );
}

.composer{
    max-width:850px;
    margin:auto;
    border:1px solid #283342;
    background:#10151d;
    border-radius:15px;
    min-height:58px;
    display:flex;
    align-items:flex-end;
    padding:9px;
    box-shadow:0 10px 35px rgba(0,0,0,.25);
}

.mic{
    width:40px;
    height:40px;
    border:0;
    background:transparent;
    color:#8d97a6;
    cursor:pointer;
    border-radius:9px;
    font-size:18px;
    flex-shrink:0;
}

.mic:hover{
    background:#181f29;
    color:white;
}

.mic.recording{
    color:#ff6577;
    background:#24151a;
}

textarea{
    flex:1;
    resize:none;
    max-height:150px;
    min-height:38px;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    padding:10px 7px;
    font-family:inherit;
    font-size:14px;
}

textarea::placeholder{
    color:#687384;
}

.send{
    width:40px;
    height:40px;
    border:0;
    border-radius:9px;
    background:#e8edf5;
    color:#0a0d12;
    cursor:pointer;
    font-size:16px;
    flex-shrink:0;
}

.send:hover{
    background:white;
}

.send:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.footer-note{
    text-align:center;
    color:#4f5968;
    font-size:10px;
    margin-top:7px;
}

/* LOADING */
.typing{
    display:flex;
    gap:4px;
    padding:7px 0;
}

.typing span{
    width:5px;
    height:5px;
    background:#7f8a9b;
    border-radius:50%;
    animation:blink 1.2s infinite;
}

.typing span:nth-child(2){
    animation-delay:.15s;
}

.typing span:nth-child(3){
    animation-delay:.3s;
}

@keyframes blink{
    0%,80%,100%{opacity:.25}
    40%{opacity:1}
}

/* MOBILE */
@media(max-width:720px){

    .sidebar{
        display:none;
    }

    .topbar{
        padding:0 14px;
    }

    .stats{
        gap:8px;
        font-size:10px;
    }

    .composer-area{
        left:0;
        padding:10px 10px 14px;
    }

    .chat{
        padding:20px 13px 130px;
    }

    .welcome h1{
        font-size:26px;
    }

    .permission{
        margin-left:0;
    }

    .message{
        gap:9px;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="brand">
            <div class="logo">J</div>

            <div>
                <div class="brand-text">JARVIS</div>
                <div class="version">v15</div>
            </div>
        </div>

        <button class="new-chat" id="newChat">
            + New chat
        </button>

        <div class="section-title">
            Conversations
        </div>

        <div class="conversation active">
            Current conversation
        </div>

        <div class="sidebar-bottom">

            <div class="connection">
                <span class="dot" id="connectionDot"></span>
                <span id="connectionText">Connecting...</span>
            </div>

        </div>

    </aside>


    <main class="main">

        <header class="topbar">

            <div class="top-title">
                JARVIS
            </div>

            <div class="stats">

                <div class="stat">
                    CPU <strong id="cpu">--</strong>
                </div>

                <div class="stat">
                    RAM <strong id="ram">--</strong>
                </div>

            </div>

        </header>


        <section class="chat" id="chat">

            <div class="chat-inner" id="chatInner">

                <div class="welcome" id="welcome">

                    <div class="welcome-box">

                        <div class="welcome-icon">
                            J
                        </div>

                        <h1>How can I help?</h1>

                        <p>
                            I'm JARVIS v15. I can answer questions,
                            check your PC status, and perform supported
                            Windows actions when you give permission.
                        </p>

                    </div>

                </div>

            </div>

        </section>

    </main>

</div>


<div class="composer-area">

    <div class="composer">

        <button class="mic" id="micButton" title="Voice input">
            🎙
        </button>

        <textarea
            id="messageInput"
            rows="1"
            placeholder="Message JARVIS..."
        ></textarea>

        <button class="send" id="sendButton" title="Send">
            ➤
        </button>

    </div>

    <div class="footer-note">
        JARVIS v15 • Permission required for system actions
    </div>

</div>


<script>

/* =========================================================
   JARVIS v15
   GitHub Pages frontend → local Flask backend
   ========================================================= */

const API_BASE = "http://127.0.0.1:5000";


/* SESSION */

let sessionId =
    localStorage.getItem("jarvis_session_id");

if(!sessionId){
    sessionId =
        "session_" +
        Date.now() +
        "_" +
        Math.random().toString(36).slice(2);

    localStorage.setItem(
        "jarvis_session_id",
        sessionId
    );
}


/* ELEMENTS */

const chatInner =
    document.getElementById("chatInner");

const welcome =
    document.getElementById("welcome");

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const cpu =
    document.getElementById("cpu");

const ram =
    document.getElementById("ram");

const connectionDot =
    document.getElementById("connectionDot");

const connectionText =
    document.getElementById("connectionText");

const newChat =
    document.getElementById("newChat");


/* =========================================================
   API HELPER
   ========================================================= */

async function api(path, options = {}){

    const response = await fetch(
        API_BASE + path,
        {
            ...options,
            headers:{
                "Content-Type":"application/json",
                ...(options.headers || {})
            }
        }
    );

    let data;

    try{
        data = await response.json();
    }
    catch{
        throw new Error(
            "Backend returned an invalid response."
        );
    }

    if(!response.ok){

        throw new Error(
            data.error ||
            data.message ||
            `Request failed (${response.status})`
        );

    }

    return data;
}


/* =========================================================
   CONNECTION CHECK
   ========================================================= */

async function checkConnection(){

    try{

        const data =
            await api("/api/health");

        connectionDot.classList.add("online");

        connectionText.textContent =
            "JARVIS online";

        return data;

    }
    catch(error){

        connectionDot.classList.remove("online");

        connectionText.textContent =
            "Backend offline";

        return null;

    }

}


/* =========================================================
   SYSTEM STATS
   ========================================================= */

async function updateSystem(){

    try{

        const data =
            await api("/api/system");

        if(data.cpu !== undefined){

            cpu.textContent =
                Math.round(data.cpu) + "%";

        }

        if(data.ram_percent !== undefined){

            ram.textContent =
                Math.round(data.ram_percent) + "%";

        }

        connectionDot.classList.add("online");

        connectionText.textContent =
            "JARVIS online";

    }
    catch{

        connectionDot.classList.remove("online");

        connectionText.textContent =
            "Backend offline";

    }

}


/* =========================================================
   ADD USER MESSAGE
   ========================================================= */

function addUserMessage(text){

    hideWelcome();

    const message =
        document.createElement("div");

    message.className =
        "message user";

    message.innerHTML = `

        <div class="avatar">
            You
        </div>

        <div class="message-content">

            <div class="message-name">
                You
            </div>

            <div class="message-text"></div>

        </div>
    `;

    message
        .querySelector(".message-text")
        .textContent = text;

    chatInner.appendChild(message);

    scrollToBottom();

}


/* =========================================================
   ADD JARVIS MESSAGE
   ========================================================= */

function addJarvisMessage(text){

    hideWelcome();

    const message =
        document.createElement("div");

    message.className =
        "message assistant";

    message.innerHTML = `

        <div class="avatar">
            J
        </div>

        <div class="message-content">

            <div class="message-name">
                JARVIS
            </div>

            <div class="message-text"></div>

            <div class="message-actions">

                <button class="small-btn copy-btn">
                    Copy
                </button>

                <button class="small-btn speak-btn">
                    Read aloud
                </button>

            </div>

        </div>
    `;

    const textElement =
        message.querySelector(".message-text");

    textElement.textContent = text;

    message
        .querySelector(".copy-btn")
        .addEventListener(
            "click",
            () => {

                navigator.clipboard.writeText(text);

            }
        );

    message
        .querySelector(".speak-btn")
        .addEventListener(
            "click",
            () => {

                if("speechSynthesis" in window){

                    speechSynthesis.cancel();

                    const speech =
                        new SpeechSynthesisUtterance(text);

                    speech.rate = 1;

                    speech.pitch = 1;

                    speechSynthesis.speak(speech);

                }

            }
        );

    chatInner.appendChild(message);

    scrollToBottom();

}


/* =========================================================
   TYPING INDICATOR
   ========================================================= */

function showTyping(){

    hideWelcome();

    const typing =
        document.createElement("div");

    typing.id =
        "typingIndicator";

    typing.className =
        "message assistant";

    typing.innerHTML = `

        <div class="avatar">
            J
        </div>

        <div class="message-content">

            <div class="message-name">
                JARVIS
            </div>

            <div class="typing">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>
    `;

    chatInner.appendChild(typing);

    scrollToBottom();

}


function hideTyping(){

    const element =
        document.getElementById(
            "typingIndicator"
        );

    if(element)
        element.remove();

}


/* =========================================================
   PERMISSION CARD
   ========================================================= */

function addPermissionCard(permission){

    hideWelcome();

    const card =
        document.createElement("div");

    card.className =
        "permission";

    card.dataset.permissionId =
        permission.id;

    card.innerHTML = `

        <div class="permission-title">
            Permission required
        </div>

        <div class="permission-description">
            ${escapeHtml(
                permission.description ||
                "JARVIS wants to perform this action."
            )}
        </div>

        <div class="permission-buttons">

            <button class="allow">
                Allow
            </button>

            <button class="deny">
                Deny
            </button>

        </div>
    `;

    const allow =
        card.querySelector(".allow");

    const deny =
        card.querySelector(".deny");

    allow.addEventListener(
        "click",
        () => resolvePermission(
            permission.id,
            true,
            card
        )
    );

    deny.addEventListener(
        "click",
        () => resolvePermission(
            permission.id,
            false,
            card
        )
    );

    chatInner.appendChild(card);

    scrollToBottom();

}


/* =========================================================
   RESOLVE PERMISSION
   ========================================================= */

async function resolvePermission(
    permissionId,
    allowed,
    card
){

    const buttons =
        card.querySelectorAll("button");

    buttons.forEach(
        button => button.disabled = true
    );

    try{

        const result =
            await api(
                "/api/permission",
                {
                    method:"POST",

                    body:JSON.stringify({

                        session_id:
                            sessionId,

                        permission_id:
                            permissionId,

                        allowed:
                            allowed

                    })

                }
            );

        card.remove();

        if(result.message){

            addJarvisMessage(
                result.message
            );

        }

    }
    catch(error){

        buttons.forEach(
            button => button.disabled = false
        );

        addJarvisMessage(
            "Permission error: " +
            error.message
        );

    }

}


/* =========================================================
   SEND MESSAGE
   ========================================================= */

async function sendMessage(){

    const text =
        input.value.trim();

    if(!text)
        return;

    input.value = "";

    resizeTextarea();

    addUserMessage(text);

    sendButton.disabled = true;

    showTyping();

    try{

        const result =
            await api(
                "/api/command",
                {
                    method:"POST",

                    body:JSON.stringify({

                        session_id:
                            sessionId,

                        message:
                            text

                    })

                }
            );

        hideTyping();

        /*
         Backend may request permission.
        */

        if(
            result.permission_required ||
            result.permission
        ){

            const permission =
                result.permission ||
                result;

            addPermissionCard({

                id:
                    permission.id ||
                    permission.permission_id,

                description:
                    permission.description ||
                    permission.action ||
                    "JARVIS wants permission to perform this action."

            });

        }

        /*
         Normal JARVIS response.
        */

        if(result.response){

            addJarvisMessage(
                result.response
            );

        }
        else if(result.message){

            addJarvisMessage(
                result.message
            );

        }

        /*
         Backend action result.
        */

        if(
            result.action_message &&
            !result.response
        ){

            addJarvisMessage(
                result.action_message
            );

        }

    }
    catch(error){

        hideTyping();

        addJarvisMessage(
            "I couldn't connect to the JARVIS backend.\n\n" +
            "Make sure web_server.py is running on your PC:\n" +
            "python web_server.py"
        );

    }
    finally{

        sendButton.disabled = false;

        input.focus();

    }

}


/* =========================================================
   NEW CHAT
   ========================================================= */

newChat.addEventListener(
    "click",
    () => {

        sessionId =
            "session_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .slice(2);

        localStorage.setItem(
            "jarvis_session_id",
            sessionId
        );

        chatInner.innerHTML = `
            <div class="welcome" id="welcome">

                <div class="welcome-box">

                    <div class="welcome-icon">
                        J
                    </div>

                    <h1>How can I help?</h1>

                    <p>
                        I'm JARVIS v15. I can answer questions,
                        check your PC status, and perform supported
                        Windows actions when you give permission.
                    </p>

                </div>

            </div>
        `;

        input.focus();

    }
);


/* =========================================================
   SEND BUTTON
   ========================================================= */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =========================================================
   ENTER KEY
   ========================================================= */

input.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================================
   AUTO RESIZE TEXTAREA
   ========================================================= */

input.addEventListener(
    "input",
    resizeTextarea
);

function resizeTextarea(){

    input.style.height =
        "auto";

    input.style.height =
        Math.min(
            input.scrollHeight,
            150
        ) + "px";

}


/* =========================================================
   MICROPHONE
   ========================================================= */

let recognition = null;
let recording = false;

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if(SpeechRecognition){

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "en-IN";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.onstart =
        () => {

            recording = true;

            micButton.classList.add(
                "recording"
            );

        };

    recognition.onend =
        () => {

            recording = false;

            micButton.classList.remove(
                "recording"
            );

        };

    recognition.onerror =
        () => {

            recording = false;

            micButton.classList.remove(
                "recording"
            );

        };

    recognition.onresult =
        event => {

            const transcript =
                event.results[0][0].transcript;

            input.value =
                transcript;

            resizeTextarea();

            input.focus();

        };

}
else{

    micButton.title =
        "Voice input is not supported in this browser";

}


micButton.addEventListener(
    "click",
    () => {

        if(!recognition){

            alert(
                "Voice input is not supported by this browser."
            );

            return;

        }

        if(recording){

            recognition.stop();

        }
        else{

            recognition.start();

        }

    }
);


/* =========================================================
   HELPERS
   ========================================================= */

function hideWelcome(){

    if(welcome)
        welcome.style.display =
            "none";

}


function scrollToBottom(){

    requestAnimationFrame(
        () => {

            const chat =
                document.getElementById(
                    "chat"
                );

            chat.scrollTop =
                chat.scrollHeight;

        }
    );

}


function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

checkConnection();

updateSystem();

setInterval(
    updateSystem,
    5000
);

input.focus();
